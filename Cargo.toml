[package]
name = "line-bot-messaging-api"
version = "0.2.0"
edition = "2024"
# 実測値: 依存（darling・encoding_rs 等）が 1.88 以上を要求するため。CI の MSRV ジョブと一致させること
rust-version = "1.88"
authors = ["uiuifree"]
description = "Typed async Rust client for the LINE Messaging API: send messages (text, Flex, templates), rich menus, insights, audiences, channel access tokens, and webhook events with signature verification"
license = "MIT"
keywords = ["line", "line-bot", "messaging-api", "chatbot", "webhook"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
readme = "README.md"
repository = "https://github.com/uiuifree/rust-line-messaging-api"
homepage = "https://github.com/uiuifree/rust-line-messaging-api"
documentation = "https://docs.rs/line-bot-messaging-api"
# 配布物には README.en.md / llms.txt / CHANGELOG.md を含める（利用者と AI の参照先）
exclude = [".github", ".idea", "test_*.jpg", "test_*.png"]

[dependencies]
base64 = "0.23"
hmac = "0.13"
reqwest = { version = "0.13", features = ["json", "query", "form", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11"
thiserror = "2"
url = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"
